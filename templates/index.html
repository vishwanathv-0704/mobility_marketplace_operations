<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mobility Operations Intelligence</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Mobility Operations Intelligence</h1>

        <p class="subtitle">
            Data ingestion & validation platform
        </p>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <div class="card">

            <h2>Upload Mobility Data</h2>

            <p class="subtitle">
                Upload the required CSV datasets to validate and load
                the mobility marketplace data.
            </p>

            <form action="/process"
                  method="POST"
                  enctype="multipart/form-data">

                <label>
                    Drivers Dataset
                </label>

                <input
                    type="file"
                    name="drivers"
                    accept=".csv"
                    required
                >


                <label>
                    Trips Dataset
                </label>

                <input
                    type="file"
                    name="trips"
                    accept=".csv"
                    required
                >


                <label>
                    Driver Activity Dataset
                </label>

                <input
                    type="file"
                    name="activity"
                    accept=".csv"
                    required
                >


                <button type="submit">
                    Validate & Load Data →
                </button>

            </form>

        </div>

    </div>

</body>

</html>
